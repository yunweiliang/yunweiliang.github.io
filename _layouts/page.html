---
layout: default
---
<article>
  {%- if page.title and page.hide_title != true %}
  <header class="page-header">
    <h1>{{ page.title | escape }}</h1>
    {%- if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  {%- endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
