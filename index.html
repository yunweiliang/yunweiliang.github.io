---
layout: default
---
<section class="home">
  <h1>Yunwei</h1>
  {%- if site.posts.size > 0 %}
  <h2 class="section-title">Essays</h2>
  <ul class="essay-list">
    {%- for essay in site.posts %}
    <li>
      <a href="{{ essay.url | relative_url }}">{{ essay.title | escape }}</a>
      {%- if essay.summary %}<p>{{ essay.summary | escape }}</p>{% endif %}
      <p class="meta"><time datetime="{{ essay.date | date_to_xmlschema }}">{{ essay.date | date: "%B %-d, %Y" }}</time></p>
    </li>
    {%- endfor %}
  </ul>
  {%- endif %}
</section>
