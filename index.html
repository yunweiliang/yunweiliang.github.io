---
layout: gate
---
<form class="gate-form" autocomplete="off" novalidate>
  <input class="gate-input" type="text" name="passcode" placeholder="open sesame"
         aria-label="Passcode" spellcheck="false" autocapitalize="off" autofocus>
  <button class="gate-enter" type="submit">Enter</button>
</form>
<script>
  // Stage 1 gate. The content behind the door is encrypted (AES-256-GCM),
  // and the passcode is the key: PBKDF2-SHA-256 turns it into the AES key.
  // Nothing on this page reveals the passcode or the content.
  (function () {
    var LOCK = {{ site.data.lock | jsonify }};
    var form = document.querySelector(".gate-form");
    var input = form.querySelector(".gate-input");
    var button = form.querySelector(".gate-enter");
    var main = document.getElementById("main");

    function bytes(b64) {
      return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    }

    // Must match normalize() in the encrypt script.
    function normalize(passcode) {
      return passcode.trim().toLowerCase();
    }

    function open(passcode) {
      var subtle = window.crypto.subtle;
      return subtle.importKey("raw", new TextEncoder().encode(normalize(passcode)), "PBKDF2", false, ["deriveKey"])
        .then(function (material) {
          return subtle.deriveKey(
            { name: "PBKDF2", hash: "SHA-256", salt: bytes(LOCK.salt), iterations: LOCK.iterations },
            material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        })
        .then(function (key) {
          return subtle.decrypt({ name: "AES-GCM", iv: bytes(LOCK.iv) }, key, bytes(LOCK.ct));
        })
        .then(function (plain) { return new TextDecoder().decode(plain); });
    }

    function wrong() {
      input.value = "";
      input.classList.remove("is-wrong");
      void input.offsetWidth; // restart the shake animation
      input.classList.add("is-wrong");
      input.focus();
    }

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Fade the gate out, swap in the home page, then reveal it block by block.
    function enter(html) {
      function show() {
        document.body.classList.remove("gate-body");
        main.className = "page is-entering";
        main.innerHTML = html;
        window.scrollTo(0, 0);
        var blocks = main.children;
        if (blocks.length === 1 && blocks[0].children.length) blocks = blocks[0].children;
        for (var i = 0; i < blocks.length; i++) {
          blocks[i].classList.add("reveal");
          blocks[i].style.setProperty("--reveal-i", Math.min(i, 8));
        }
        setTimeout(function () { main.classList.remove("is-entering"); }, 3200);
      }
      if (reduceMotion) return show();
      main.classList.add("is-leaving");
      return new Promise(function (resolve) {
        setTimeout(function () { show(); resolve(); }, 700);
      });
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (button.disabled) return;
      button.disabled = true;
      open(input.value)
        .then(enter)
        .catch(wrong)
        .then(function () { button.disabled = false; });
    });

    input.addEventListener("animationend", function () {
      input.classList.remove("is-wrong");
    });
  })();
</script>
