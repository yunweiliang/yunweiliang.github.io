<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.title %}
<title>{{ page.title | escape }} · {{ site.title | escape }}</title>
{%- else %}
<title>{{ site.title | escape }}</title>
{%- endif %}
{%- assign description = page.summary | default: page.description | default: site.description %}
<meta name="description" content="{{ description | strip_html | strip_newlines | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ description | strip_html | strip_newlines | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'essay' %}article{% else %}website{% endif %}">
<meta name="color-scheme" content="light dark">
<script>
  // Apply a saved theme before first paint so there is no flash.
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
{%- feed_meta %}
