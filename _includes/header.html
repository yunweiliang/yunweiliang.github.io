<header class="site-header">
  <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
  <nav class="site-nav" aria-label="Main">
    <a href="{{ '/essays/' | relative_url }}"{% if page.url contains '/essays/' %} aria-current="page"{% endif %}>Essays</a>
    <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} aria-current="page"{% endif %}>Projects</a>
    <a href="{{ '/archive/' | relative_url }}">Old site</a>
  </nav>
  <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Toggle light/dark theme">
    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></svg>
  </button>
</header>
